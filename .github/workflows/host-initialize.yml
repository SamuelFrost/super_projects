name: Host initialize

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/host-initialize.yml'
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/host-initialize.yml'

jobs:
  host-initialize:
    name: host initialize (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            unlock_mode: askpass
          - os: macos-latest
            unlock_mode: quiet

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Set up Docker (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install colima docker docker-compose
          colima start --cpu 2 --memory 4 --disk 20
          sudo mkdir -p /var/run
          sudo ln -sf "$HOME/.colima/default/docker.sock" /var/run/docker.sock
          docker info

      - name: Run host initialize CI tests
        run: sh .devcontainer/scripts/test/host-initialize-ci.sh "${{ matrix.unlock_mode }}"
