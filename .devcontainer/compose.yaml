name: "super_projects"

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        DEVELOPER_UID: ${DEVELOPER_UID:-501}
        DOCKER_GID: ${DOCKER_GID:-1}
    pull_policy: never
    volumes:
      - ../:/workspaces:cached
      # Reuse host Docker daemon (achieves similar effect to devcontainer feature "docker-outside-of-docker")
      - /var/run/docker.sock:/var/run/docker.sock

      # Named volumes for tool state (macOS-friendly I/O). Each volume is mounted twice:
      # once at the conventional home path, once under .devcontainer/persist/ for discoverability.
      # See .devcontainer/persist/README.md. Do not mount whole /home/developer — that freezes
      # image-owned installs (Gemini, agent, .bashrc) after the first volume create.

      # Gemini CLI sessions/config
      - gemini-data:/home/developer/.gemini
      - gemini-data:/workspaces/.devcontainer/persist/gemini
      # GitHub CLI auth tokens (gh auth login)
      - gh-data:/home/developer/.config/gh
      - gh-data:/workspaces/.devcontainer/persist/gh
      # Git XDG config (~/.config/git/config)
      - git-config:/home/developer/.config/git
      - git-config:/workspaces/.devcontainer/persist/git
      # Chrome profile: named volume so Docker initialises it from the image
      # (a bind-mount would create the parent dir as root, crashing Chrome).
      - chrome-devtools-mcp-profile:/home/developer/chrome-profile
      - chrome-devtools-mcp-profile:/workspaces/.devcontainer/persist/chrome
      # mise tool cache: persists downloads/installs across rebuilds
      - mise-data:/home/developer/.local/share/mise
      - mise-data:/workspaces/.devcontainer/persist/mise
      # SSH keys: bind-mounted from host home directory for continuity with non-devcontainer shells
      # Note: this increases the risk of SSH key exposure such as in the case the container is compromised.
      # HOST_HOME_DIR comes from initializeCommand (.devcontainer/.env); avoids empty ${HOME} when IDE runs compose. TODO: may work without the special HOST_HOME_DIR treatment, just need to test it out on different machines (mac/wsl/linux).
      - ${HOST_HOME_DIR:-${HOME}}/.ssh:/home/developer/.ssh:cached
      # Bash history: mounts from host home directory for continuity with non-devcontainer shells
      # - ${HOST_HOME_DIR:-${HOME}}/.bash_history:/home/developer/.bash_history
    # start-vnc + mise install run here (not in the Dockerfile) so image builds stay
    # fast and tool installs persist in the mise-data volume across rebuilds.
    # ssh-agent runs for the container lifetime; ensure-auth (postStartCommand) loads keys.
    command:
      - bash
      - -c
      - |
        AGENT_SOCK=/home/developer/.ssh/agent.sock
        export SSH_AUTH_SOCK=$$AGENT_SOCK
        if [ -S "$$AGENT_SOCK" ]; then
          ssh-add -l >/dev/null 2>&1 || rm -f "$$AGENT_SOCK"
        fi
        if [ ! -S "$$AGENT_SOCK" ]; then
          eval "$$(ssh-agent -a "$$AGENT_SOCK")"
        fi
        ensure-auth
        print-cursor-worker-hint
        if ! grep -q mise-shell-init.sh ~/.bashrc 2>/dev/null; then
          MISE_SHELL_INIT=/workspaces/.devcontainer/dockerfile_scripts/mise-shell-init.sh
          echo "[ -r $$MISE_SHELL_INIT ] && . $$MISE_SHELL_INIT" >> ~/.bashrc
        fi
        start-vnc
        cd /workspaces
        mise install
        exec tail -f /dev/null
    hostname: super_projects
    user: developer
    environment:
      UID: ${DEVELOPER_UID:-501}
      SSH_AUTH_SOCK: /home/developer/.ssh/agent.sock
    ports:
      - "6080:6080"   # noVNC  — browser GUI for VNC
      # - "5900:5900" # VNC raw port (optional, for native VNC clients)
      # - "9223:9223"   # Chrome remote debugging — (optional for host-side npx chrome-devtools-mcp to connect)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Chrome requires more shared memory than Docker's default 64 MB.
    shm_size: '3gb'
    networks:
      - super_projects_default

volumes:
  # Gemini CLI sessions/config. Lost only on `docker volume rm super_projects_gemini-data`.
  gemini-data: {}
  # Chrome profile data: logins, cookies, extensions, history.
  # Survives container stop/start and rebuilds; lost only on `docker volume rm super_projects_chrome-devtools-mcp-profile`.
  chrome-devtools-mcp-profile: {}
  # mise downloads and installs (~/.local/share/mise).
  # Survives rebuilds so tool versions don't need to be re-downloaded or recompiled.
  # Lost only on `docker volume rm super_projects_mise-data`.
  mise-data: {}
  # GitHub CLI auth (gh auth login). Lost only on `docker volume rm super_projects_gh-data`.
  gh-data: {}
  # git XDG config (~/.config/git). Lost only on `docker volume rm super_projects_git-config`.
  git-config: {}

networks:
  super_projects_default:
    name: super_projects_default
