name: ${SUPER_PROJECTS_NAME:-super_projects}

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        DEVELOPER_UID: ${DEVELOPER_UID:-501}
        DOCKER_GID: ${DOCKER_GID:-1}
        SUPER_PROJECTS_WORKDIR: ${SUPER_PROJECTS_WORKDIR:-workspaces}
    pull_policy: never
    volumes:
      # HOST_WORKSPACE_DIR comes from generated .devcontainer/.env (gitignored).
      # IDE/devcontainer up regenerate it via initializeCommand; before manual
      # `docker compose`, re-run initializeCommand.sh and use
      # `--project-directory .devcontainer` so .env is loaded.
      - ${HOST_WORKSPACE_DIR:-../}:/${SUPER_PROJECTS_WORKDIR:-workspaces}:cached
      # Reuse host Docker daemon (achieves similar effect to devcontainer feature "docker-outside-of-docker")
      - /var/run/docker.sock:/var/run/docker.sock

      # Named volumes for tool state (macOS-friendly I/O). Each volume is mounted twice:
      # once at the conventional home path, once under .devcontainer/persist/ for discoverability.
      # See .devcontainer/persist/README.md. Do not mount whole /home/developer — that freezes
      # image-owned installs (Gemini, agent, .bashrc) after the first volume create.

      # Gemini CLI sessions/config
      - gemini-data:/home/developer/.gemini
      - gemini-data:/${SUPER_PROJECTS_WORKDIR:-workspaces}/.devcontainer/persist/gemini
      # GitHub CLI auth tokens (gh auth login)
      - gh-data:/home/developer/.config/gh
      - gh-data:/${SUPER_PROJECTS_WORKDIR:-workspaces}/.devcontainer/persist/gh
      # Git XDG config (~/.config/git/config)
      - git-config:/home/developer/.config/git
      - git-config:/${SUPER_PROJECTS_WORKDIR:-workspaces}/.devcontainer/persist/git
      # Chrome profile: named volume so Docker initialises it from the image
      # (a bind-mount would create the parent dir as root, crashing Chrome).
      - chrome-devtools-mcp-profile:/home/developer/chrome-profile
      - chrome-devtools-mcp-profile:/${SUPER_PROJECTS_WORKDIR:-workspaces}/.devcontainer/persist/chrome
      # mise tool cache: persists downloads/installs across rebuilds
      - mise-data:/home/developer/.local/share/mise
      - mise-data:/${SUPER_PROJECTS_WORKDIR:-workspaces}/.devcontainer/persist/mise
      # Cursor agent state: transcripts, CLI sessions, MCP config, skills
      - cursor-data:/home/developer/.cursor
      - cursor-data:/${SUPER_PROJECTS_WORKDIR:-workspaces}/.devcontainer/persist/cursor
      # Host ssh-agent only (private keys never enter the container).
      # HOST_SSH_AUTH_SOCK is set by initializeCommand → .devcontainer/scripts/shell/initializeCommand.sh.
      # The default allows manual `docker compose` (down, ps, ...) before .env exists.
      # On WSLg it may differ from ensure-host-ssh-agent (~/.cache); see .agents/attributes/tools/host_access/wslg_ssh_agent_socket_path.md.
      - ${HOST_SSH_AUTH_SOCK:-${XDG_RUNTIME_DIR:-${HOME}/.cache}/${SUPER_PROJECTS_NAME:-super_projects}-ssh-agent.sock}:/ssh-agent.sock
      # Shared known_hosts (file bind; created on host by shell/ensure-host-ssh-agent when writable).
      - ${HOST_HOME_DIR:-${HOME}}/.ssh/known_hosts:/home/developer/.ssh/known_hosts:ro
      # Bash history: mounts from host home directory for continuity with non-devcontainer shells
      # - ${HOST_HOME_DIR:-${HOME}}/.bash_history:/home/developer/.bash_history
    # start-vnc + mise install run here (not in the Dockerfile) so image builds stay
    # fast and tool installs persist in the mise-data volume across rebuilds.
    # SSH uses the host-forwarded agent at /ssh-agent.sock (ensure-auth reports status).
    command:
      - bash
      - -c
      - |
        export SSH_AUTH_SOCK=/ssh-agent.sock
        ensure-auth
        print-cursor-worker-hint
        start-vnc
        cd /${SUPER_PROJECTS_WORKDIR:-workspaces}
        mise install
        exec tail -f /dev/null
    working_dir: /${SUPER_PROJECTS_WORKDIR:-workspaces}
    hostname: ${SUPER_PROJECTS_NAME:-super_projects}
    user: developer
    environment:
      UID: ${DEVELOPER_UID:-501}
      SSH_AUTH_SOCK: /ssh-agent.sock
      SUPER_PROJECTS_NAME: ${SUPER_PROJECTS_NAME:-super_projects}
      SUPER_PROJECTS_WORKDIR: ${SUPER_PROJECTS_WORKDIR:-workspaces}
      HOST_WORKSPACE_DIR: ${HOST_WORKSPACE_DIR}
    ports:
      - "6080:6080"   # noVNC  — browser GUI for VNC
      # - "5900:5900" # VNC raw port (optional, for native VNC clients)
      # - "9223:9223"   # Chrome remote debugging — (optional for host-side npx chrome-devtools-mcp to connect)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Chrome requires more shared memory than Docker's default 64 MB.
    shm_size: '3gb'
    networks:
      - super_projects_default

  # Mirrors the published ports of docker compose stacks in the workspace onto 127.0.0.1 so in-container
  # Chrome / chrome-devtools-mcp can use http://localhost:<port> like on the host (see localhost-forwards.md).
  # Stop or start it on its own: docker compose --project-directory .devcontainer -f .devcontainer/compose.yaml stop localhost_forward_proxy
  localhost_forward_proxy:
    build: scripts/localhost_forward_proxy
    init: true
    restart: unless-stopped
    depends_on:
      - devcontainer
    # Shares the devcontainer's network namespace, so listening on 127.0.0.1 here is listening in the devcontainer.
    network_mode: "service:devcontainer"
    environment:
      # Which compose project / workspace paths count as "ours" (see Watcher#workspace_prefixes).
      SUPER_PROJECTS_NAME: ${SUPER_PROJECTS_NAME:-super_projects}
      SUPER_PROJECTS_WORKDIR: ${SUPER_PROJECTS_WORKDIR:-workspaces}
      HOST_WORKSPACE_DIR: ${HOST_WORKSPACE_DIR}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Runs the checked-out code, so a git pull applies on the next restart without rebuilding the image.
      - ${HOST_WORKSPACE_DIR:-../}/.devcontainer/scripts/localhost_forward_proxy:/opt/localhost_forward_proxy:ro
    command: ruby /opt/localhost_forward_proxy/bin/localhost_forward_proxy

volumes:
  # Gemini CLI sessions/config. Lost only on `docker volume rm ${SUPER_PROJECTS_NAME:-super_projects}_gemini-data`.
  gemini-data: {}
  # Chrome profile data: logins, cookies, extensions, history.
  # Survives container stop/start and rebuilds; lost only on `docker volume rm ${SUPER_PROJECTS_NAME:-super_projects}_chrome-devtools-mcp-profile`.
  chrome-devtools-mcp-profile: {}
  # mise downloads and installs (~/.local/share/mise).
  # Survives rebuilds so tool versions don't need to be re-downloaded or recompiled.
  # Lost only on `docker volume rm ${SUPER_PROJECTS_NAME:-super_projects}_mise-data`.
  mise-data: {}
  # GitHub CLI auth (gh auth login). Lost only on `docker volume rm ${SUPER_PROJECTS_NAME:-super_projects}_gh-data`.
  gh-data: {}
  # git XDG config (~/.config/git). Lost only on `docker volume rm ${SUPER_PROJECTS_NAME:-super_projects}_git-config`.
  git-config: {}
  # Cursor agent state (~/.cursor): agent-transcripts, CLI chats, MCP config, skills.
  # Lost only on `docker volume rm ${SUPER_PROJECTS_NAME:-super_projects}_cursor-data`.
  cursor-data: {}

networks:
  super_projects_default:
    name: ${SUPER_PROJECTS_NAME:-super_projects}_default
