services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    pull_policy: never
    volumes:
      # - ${HOST_WORKSPACE_DIR:-../}:/workspaces:cached # WSL requires route specified, override file provides
      # Reuse host Docker daemon (achieves similar effect to devcontainer feature "docker-outside-of-docker")
      - /var/run/docker.sock:/var/run/docker.sock

      # Named volumes for tool state (macOS-friendly I/O). Each volume is mounted twice:
      # once at the conventional home path, once under .devcontainer/persist/ for discoverability.
      # See .devcontainer/persist/README.md. Do not mount whole /home/developer — that freezes
      # image-owned installs (Gemini, agent, .bashrc) after the first volume create.

      # Gemini CLI sessions/config
      - gemini-data:/home/developer/.gemini
      - gemini-data:/workspaces/.devcontainer/persist/gemini
      # GitHub CLI auth tokens (gh auth login)
      - gh-data:/home/developer/.config/gh
      - gh-data:/workspaces/.devcontainer/persist/gh
      # Git XDG config (~/.config/git/config)
      - git-config:/home/developer/.config/git
      - git-config:/workspaces/.devcontainer/persist/git
      # Chrome profile: named volume so Docker initialises it from the image
      # (a bind-mount would create the parent dir as root, crashing Chrome).
      - chrome-devtools-mcp-profile:/home/developer/chrome-profile
      - chrome-devtools-mcp-profile:/workspaces/.devcontainer/persist/chrome
      # mise tool cache: persists downloads/installs across rebuilds
      - mise-data:/home/developer/.local/share/mise
      - mise-data:/workspaces/.devcontainer/persist/mise
      # Cursor agent state: transcripts, CLI sessions, MCP config, skills
      - cursor-data:/home/developer/.cursor
      - cursor-data:/workspaces/.devcontainer/persist/cursor
      # Bash history: mounts from host home directory for continuity with non-devcontainer shells
      # - ${HOST_HOME_DIR:-${HOME}}/.bash_history:/home/developer/.bash_history
    # start-vnc + mise install run here (not in the Dockerfile) so image builds stay
    # fast and tool installs persist in the mise-data volume across rebuilds.
    # SSH uses the host-forwarded agent at /ssh-agent.sock (ensure-auth reports status).
    command:
      - bash
      - -c
      - |
        export SSH_AUTH_SOCK=/ssh-agent.sock
        ensure-auth
        print-cursor-worker-hint
        start-vnc
        cd /workspaces
        mise install
        exec tail -f /dev/null
    working_dir: /workspaces
    user: developer
    environment:
      SSH_AUTH_SOCK: /ssh-agent.sock
      EDITOR: code
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    ports:
      - "6080:6080"   # noVNC  — browser GUI for VNC
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Chrome requires more shared memory than Docker's default 64 MB.
    shm_size: '3gb'

  # Mirrors published TCP ports of docker compose stacks in the workspace onto super_projects default network localhost (127.0.0.1 and ::1) so
  # Chrome / chrome-devtools-mcp in the devcontainer can use http://localhost:<port> like on the host (see scripts/localhost_forward_proxy/.directory_information.md).
  # Stop or start it on its own: docker compose --project-directory .devcontainer -f .devcontainer/compose.yaml -f .devcontainer/docker_compose_configuration_customizations/naming/compose.naming.yaml -f .devcontainer/docker_compose_configuration_customizations/naming/compose.naming.override.yaml -f .devcontainer/docker_compose_configuration_customizations/host_filesystem_compatibility/compose.user-ids.yaml -f .devcontainer/docker_compose_configuration_customizations/host_filesystem_compatibility/compose.project-directory.yaml -f .devcontainer/docker_compose_configuration_customizations/ssh_agent_socket/compose.ssh-agent-socket.yaml -f .devcontainer/docker_compose_configuration_customizations/ssh_known_hosts/compose.ssh-known-hosts.yaml -f .devcontainer/docker_compose_configuration_customizations/miscellaneous_overrides/compose.miscellaneous.yaml -f .devcontainer/docker_compose_configuration_customizations/miscellaneous_overrides/compose.miscellaneous.override.yaml stop localhost_forward_proxy
  localhost_forward_proxy:
    build: scripts/localhost_forward_proxy
    init: true
    restart: unless-stopped
    depends_on:
      - devcontainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: ruby /opt/localhost_forward_proxy/bin/localhost_forward_proxy

volumes:
  # Gemini CLI sessions/config. Lost only on `docker volume rm ${SUPER_PROJECTS_NAME:-super_projects}_gemini-data`.
  gemini-data: {}
  # Chrome profile data: logins, cookies, extensions, history.
  # Survives container stop/start and rebuilds; lost only on `docker volume rm ${SUPER_PROJECTS_NAME:-super_projects}_chrome-devtools-mcp-profile`.
  chrome-devtools-mcp-profile: {}
  # mise downloads and installs (~/.local/share/mise).
  # Survives rebuilds so tool versions don't need to be re-downloaded or recompiled.
  # Lost only on `docker volume rm ${SUPER_PROJECTS_NAME:-super_projects}_mise-data`.
  mise-data: {}
  # GitHub CLI auth (gh auth login). Lost only on `docker volume rm ${SUPER_PROJECTS_NAME:-super_projects}_gh-data`.
  gh-data: {}
  # git XDG config (~/.config/git). Lost only on `docker volume rm ${SUPER_PROJECTS_NAME:-super_projects}_git-config`.
  git-config: {}
  # Cursor agent state (~/.cursor): agent-transcripts, CLI chats, MCP config, skills.
  # Lost only on `docker volume rm ${SUPER_PROJECTS_NAME:-super_projects}_cursor-data`.
  cursor-data: {}
